# Plays every game's tournament and commits the results to web/public/data,
# which Vercel then deploys. A game whose bots, maps, rules, shared match code
# and pinned packages are unchanged since its last tournament is skipped, so
# this mostly runs when something changed; the weekly run catches anything
# missed.

name: Tournament

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  push:
    branches: [main]
    paths:
      - "games/**"
      - "platform/arena/**"
      - "pyproject.toml"
      - ".github/workflows/tournament.yml"
  workflow_dispatch:
    inputs:
      force:
        description: Play again even if nothing changed
        type: boolean
        default: false

permissions:
  contents: write

# A new run waits for the one playing to finish, which may take an hour or two, and then
# plays the latest main.
concurrency:
  group: tournament
  cancel-in-progress: false

jobs:
  tournament:
    # It pushes to main, so it only plays main: a run started on another branch would
    # push that branch's commits along with its results.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # the latest, not the commit that queued this run: the run before may have published it
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # The CPU build of the torch version pyproject.toml pins; keep the two in step.
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[neural]"
      - name: Play
        env:
          FORCE: ${{ inputs.force }}
        run: |
          args=(--workers "$(nproc)")
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          for game in $(python -m arena games --ids); do
            python -m arena tournament "$game" "${args[@]}"
          done
      - name: Publish on the latest main
        # Every file in web/public/data is written from the games' code and a tournament's
        # results.json and replays, so this needs no merge with what main gained meanwhile:
        # it takes the latest main, puts in the results of the games it played, and
        # publishes every game again from there.
        run: |
          played=$(git ls-files --modified --others -- 'web/public/data/*/results.json' | xargs -r -n1 dirname)
          for folder in $played; do
            mkdir -p "$RUNNER_TEMP/$folder" && mv "$folder/results.json" "$folder/replays" "$RUNNER_TEMP/$folder/"
          done
          git fetch origin main
          git reset --hard origin/main
          for folder in $played; do
            rm -rf "$folder/replays" && mkdir -p "$folder" && mv "$RUNNER_TEMP/$folder"/* "$folder/"
          done
          for game in $(python -m arena games --ids); do python -m arena publish "$game"; done
          git add web/public/data
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Publish tournament results"
          git push origin HEAD:main
