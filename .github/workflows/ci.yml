name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[neural,test]"
      - name: Test
        run: python -m pytest -q platform/tests
      - name: Check the published replays play back exactly
        run: |
          shopt -s nullglob
          replays=(web/public/data/*/replays/*.json)
          if [ ${#replays[@]} -gt 0 ]; then python -m arena verify "${replays[@]}"; fi

  graphite:
    name: Graphite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/graphite
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            games/graphite/requirements.txt
            games/graphite/ml/requirements.txt
      - name: Install
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest
      - name: Test the game and its bots
        run: python -m pytest -q tests
      - name: Test the training code
        run: python -m pytest -q ml/tests

  ricochet:
    name: Ricochet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/ricochet
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONPATH: src # test the working tree, as the game's README does
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: games/ricochet/pyproject.toml
      - name: Install
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[display,learn,dev]"
      - name: Test the game, its bots and the training code
        run: python -m pytest -q

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
