[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ricochet-ai"
version = "2.0.0"
description = "A deterministic ricochet tank duel for humans, bots, and reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
display = ["pygame>=2.6"]
training = ["gymnasium>=1.0", "numpy>=2.0", "pettingzoo>=1.24"]
learn = ["gymnasium>=1.0", "numpy>=2.0", "pettingzoo>=1.24", "stable-baselines3>=2.5", "torch>=2.3"]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
ricochet = "ricochet.runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ricochet"]

[tool.hatch.build.targets.wheel.force-include]
"maps" = "ricochet/data/maps"
"ais" = "ricochet/data/ais"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

