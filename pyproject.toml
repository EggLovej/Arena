[project]
name = "arena"
version = "0.1.0"
description = "The shared match runner, replays, tournaments and ratings for the Arena games website"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# What the learned bots (Graphite's Neural, Beast and Atlas AI) need to play.
neural = ["numpy==2.5.3", "torch==2.14.0"]
test = ["pytest>=8"]

[project.scripts]
arena = "arena.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["platform"]
include = ["arena*"]

[tool.pytest.ini_options]
testpaths = ["platform/tests"]
